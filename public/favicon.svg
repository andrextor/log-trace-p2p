<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 128 128">
  <circle cx="32" cy="64" r="12" stroke-width="8" class="main-path" stroke="currentColor"/>
  <circle cx="96" cy="64" r="12" stroke-width="8" class="main-path" stroke="currentColor"/>
  
  <path d="M44 64h40" stroke-width="8" stroke-linecap="round" class="main-path" stroke="currentColor" stroke-dasharray="2 12"/>
  
  <path d="M52 44l-8 20 8 20M76 44l8 20-8 20" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class="accent-path" stroke="currentColor"/>

  <style>
    .main-path, .accent-path { stroke: #17191E; fill: none; }
    
    @media (prefers-color-scheme: dark) {
      .main-path, .accent-path { stroke: #FFFFFF; }
    }
    
    /* Animación opcional para el rastro de datos */
    .main-path[stroke-dasharray] {
      animation: dash 2s linear infinite;
    }
    
    @keyframes dash {
      to {
        stroke-dashoffset: -28;
      }
    }
  </style>
